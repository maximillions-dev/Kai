name: 'Setup Build Environment'
description: 'Sets up Java, Gradle, and optionally Android SDK for Kai builds'
inputs:
  cache-gradle:
    description: 'Whether to cache Gradle dependencies'
    default: 'true'
    required: false
  setup-android:
    description: 'Whether to set up Android SDK'
    default: 'false'
    required: false
  install-build-tools:
    description: 'Whether to install Android build tools (requires setup-android)'
    default: 'false'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set execution flag for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: Cache Gradle dependencies
      if: inputs.cache-gradle == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set up Android SDK
      if: inputs.setup-android == 'true'
      uses: android-actions/setup-android@v3

    - name: Install Android Build Tools
      if: inputs.install-build-tools == 'true'
      shell: bash
      run: |
        sdkmanager "build-tools;36.0.0"
        sdkmanager "build-tools;29.0.3"
